<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Navbar-->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand fw-bold">
                ShopEase
            </a>

            <a href="cart.html" class="btn btn-light">
                Cart<img src="images/cart.png">

                <span id="cartCount">
                    0
                </span>
            </a>

        </div>

    </nav>

    <!--Products-->

    <div class="container py-5">
        <h1 class="text-center mb-5 fw-bold">
            Our Products
        </h1>

        <div class="row g-4">

            <!--Product 1-->

            <div class="col-lg-4 col-md-6">

                <div class="card h-100 shadow-sm">

                    <img src="images/diamond_necklace.jpeg" class="card-img-top product-image">

                    <div class="card-body" d-flex flex-column>

                        <h5>
                            Diamond Necklace
                        </h5>

                        <p>
                            Premium jewellery collection
                        </p>

                        <h5 class="fw-bold">
                           ₹1799 
                        </h5>

                        <button class="btn btn-dark" onclick="addToCart('Diamond Necklace', 1799)">
                            Add to Cart
                        </button>

                    </div>

                </div>

            </div>

            <!--Product 2-->

            <div class="co-lg-4 col-md-6">

                <div class="card h-100 shadow-sm">

                    <img src="images/wrist_watch.webp" class="card-img-top product-image">

                    <div class="card-body d-flex flex-column">

                        <h5 class="card-title">
                            Classic Watch
                        </h5>

                        <p class="text-muted">
                            Stylish wrist watch
                        </p>

                        <h5 class="fw-bold">
                            ₹2499
                        </h5>

                        <button class="btn btn-dark mt-auto" onclick="addToCart('Classic Watch', 2499)">
                            Add to Cart
                        </button>

                    </div>

                </div>

            </div>


            <!--Product 3-->

            <div class="col-lg-4 col-md-6">

                <div class="card h-100 shadow-sm">

                    <img src="images/earrings.webp" class="card-img-top product-image">

                    <div class="card-body d-flex flex-column">

                        <h5 class="card-title">
                            Earrings
                        </h5>

                        <p class="text-muted">
                            Rose gold platted Earrings
                        </p>

                        <h5 class="fw-bold">
                            ₹1299
                        </h5>

                        <button class="btn btn-dark mt-auto" onclick="addToCart('Earrings', 1299)">
                            Add to Cart
                        </button>

                    </div>

                </div>

            </div>

            <!--Product 4-->

            <div class="col-lg-4 col-md-6">

                <div class="card h-100 shadow-sm">

                    <img src="images/bracelet.webp" class="card-img-top product-image">

                    <div class="card-body d-flex flex-column">

                        <h5 class="card-title">
                            Bracelet
                        </h5>

                        <p class="text-muted">
                            Premium Bracelet
                        </p>

                        <h5 class="fw-bold">
                            ₹1999
                        </h5>

                        <button class="btn btn-dark mt-auto" onclick="addToCart('Bracelet', 1999)">
                            Add to Cart
                        </button>

                    </div>

                </div>

            </div>

            <!--Product 5-->

            <div class="col-lg-4 col-md-6">

                <div class="card h-100 shadow-sm">

                    <img src="images/bangles.webp" class="card-img-top product-image">

                    <div class="card-body d-flex flex-column">

                        <h5 class="card-title">
                            Bangles
                        </h5>

                        <p class="text-muted">
                            Gold platted bangles
                        </p>

                        <h5 class="fw-bold">
                            ₹2299
                        </h5>

                        <button class="btn btn-dark mt-auto" onclick="addToCart('Bangles', 2299)">
                            Add to Cart
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
