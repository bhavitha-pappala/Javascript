<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar bg-dark navbar-dark">
        <div class="container">
            <a class="navbar-brand">
                ShopEase
            </a>

            <a href="home.html" class="btn btn-light">
                Continue Shopping
            </a>

        </div>

    </nav>

    <div class="container" py-5>
        <h1>
            Your cart
        </h1>

        <div class="row">

            <!--Products-->

            <div class="col-lg-8">

                <div id="cartItems">

                </div>
            </div>

                <!--Summary-->

                <div class="col-lg-4">

                    <div class="card p-4">

                        <h4>
                            Order Summary
                        </h4>

                        <hr>

                        <p>
                            Subtotal: ₹<span id="Subtotal">
                                0
                            </span>
                        </p>

                        <p>
                            Discount: ₹<span id="discount">
                                0
                            </span>
                        </p>

                        <p>
                            GST: ₹<span id="gst">
                                0
                            </span>
                        </p>

                        <h4>
                            Total: ₹<span id="total">
                                0
                            </span>
                        </h4>

                        <button class="btn btn-success w-100">
                            Checkout
                        </button>

                    </div>

                </div>

            </div>

        </div>

        <script src="script.js"></script>
        
</body>
</html>
